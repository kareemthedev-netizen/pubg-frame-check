name: Auto Device Scraper

on:
  schedule:
    - cron: '0 0 * * *'     # كل يوم الساعة 12 midnight
    - cron: '0 6 * * *'     # وكل يوم الساعة 6 الصبح (تأمين)
  workflow_dispatch:        # عشان تقدر تشغله يدوي لو عايز

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 firebase-admin lxml
          
      - name: Run scraper
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python scraper/main.py
